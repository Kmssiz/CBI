{# Table length picker. Usage: {% include "_page_size.html" with page=reports %} #}
<label class="pagination-size inline-flex items-center gap-2 text-xs font-semibold text-slate-500 dark:text-slate-400">
  <span>Lignes</span>
  <select data-page-size aria-label="Nombre de lignes par page"
          class="rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-2 py-1 text-xs font-bold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/40">
    {% for n in page_size_choices %}<option value="{{ n }}"{% if n == page.paginator.per_page %} selected{% endif %}>{{ n }}</option>{% endfor %}
  </select>
</label>
<script>
(function () {
  var select = document.currentScript.previousElementSibling.querySelector('[data-page-size]');
  select.addEventListener('change', function () {
    var url = new URL(window.location.href);
    url.searchParams.set('per_page', select.value);
    url.searchParams.delete('page');          // the old page number means something else with another length
    window.location.assign(url.toString());
  });
})();
</script>
