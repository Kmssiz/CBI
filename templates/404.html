<!DOCTYPE html>
<html lang="fr">

<head>
    <script>(function () { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); }());</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page non trouvée</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- DotLottie Player -->
    <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>

    <style>
        body {
            background-color: #f4f4f4;
        }
        .error-theme-toggle { position: fixed; top: 20px; right: 22px; z-index: 5; display: inline-flex; align-items: center; gap: 7px; padding: 9px 13px; border: 1px solid #d8d8dc; border-radius: 18px; background: #fff; color: #292a2f; font-size: 11px; font-weight: 700; cursor: pointer; }
        html.dark body { background-color: #111318 !important; color: #f1f2f4; }
        html.dark h1 { color: #f1f2f4 !important; }
        html.dark .error-theme-toggle { border-color: #3a3d46; background: #24262d; color: #f1f2f4; }
    </style>
</head>

<body class="d-flex flex-column justify-content-center align-items-center vh-100 text-center">
    <button class="error-theme-toggle" type="button" id="error-theme-toggle" aria-pressed="false" title="Activer le mode sombre"><span id="error-theme-icon">dark_mode</span><span id="error-theme-label">Mode sombre</span></button>

    <h1 class="text-dark">Oups ! Page non trouvée</h1>

    <div class="d-flex justify-content-center">
        <dotlottie-player src="https://lottie.host/58fc93e6-7031-4a5b-9cab-576a199b0b4a/93Rhw36KJA.lottie"
            background="transparent" speed="1" style="width: 400px; height: 400px;" loop autoplay>
        </dotlottie-player>
    </div>

    <p class="text-muted">La page que vous recherchez a peut-être été supprimée ou est temporairement indisponible, ou
        vous devez vous connecter.</p>

    <a href="{% url 'login' %}" class="btn btn-primary">Retour</a>

    <!-- Bootstrap JS (optional, if needed for other functionalities) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            var toggle = document.getElementById('error-theme-toggle'), icon = document.getElementById('error-theme-icon'), label = document.getElementById('error-theme-label'), root = document.documentElement;
            function applyTheme(theme) { var dark = theme === 'dark'; root.classList.toggle('dark', dark); localStorage.setItem('theme', dark ? 'dark' : 'light'); toggle.setAttribute('aria-pressed', String(dark)); toggle.title = dark ? 'Activer le mode clair' : 'Activer le mode sombre'; icon.textContent = dark ? 'light_mode' : 'dark_mode'; label.textContent = dark ? 'Mode clair' : 'Mode sombre'; }
            applyTheme(localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'); toggle.addEventListener('click', function () { applyTheme(root.classList.contains('dark') ? 'light' : 'dark'); });
        }());
    </script>

</body>

</html>
