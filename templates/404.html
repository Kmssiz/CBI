<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- DotLottie Player -->
    <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>

    <style>
        body {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100 text-center">

    <h1 class="text-dark">Oops! Page Not Found</h1>
    
    <div class="d-flex justify-content-center">
        <dotlottie-player 
            src="https://lottie.host/58fc93e6-7031-4a5b-9cab-576a199b0b4a/93Rhw36KJA.lottie" 
            background="transparent" 
            speed="1" 
            style="width: 400px; height: 400px;" 
            loop autoplay>
        </dotlottie-player>
    </div>

    <p class="text-muted">The page you are looking for might have been removed or is temporarily unavailable, or you need to log in.</p>
    
    <a href="{% url 'login' %}" class="btn btn-primary">Go Back</a>

    <!-- Bootstrap JS (optional, if needed for other functionalities) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
