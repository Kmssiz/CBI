<!DOCTYPE html>
<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BI Login French Power BI Focus</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen font-display">
<div class="flex min-h-screen w-full">
<div class="hidden lg:flex lg:w-1/2 xl:w-3/5 relative overflow-hidden bg-[#0a0f14]">
<div class="absolute inset-0 z-10 bg-gradient-to-r from-background-dark/80 via-transparent to-transparent"></div>
<div class="h-full w-full bg-center bg-no-repeat bg-cover opacity-60 grayscale hover:grayscale-0 transition-all duration-700" data-alt="Abstract 3D render of interconnected data nodes" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCzBqaxutycB4EbH6YdsN9Sel24vypH-oRe_lsVF3cuxerJJLktmCCI2MA7hiwt9F_OSIJPvxOY68FsN-94DnsRzhq20AORq8nY_KYqOQUWR8dHjDR4BuGVmgoF6tDe40RkfvE8cK4XQKFnGlKzW4fhuYkH_igOf5HmYIl8RlRnvgEGhpgeO_rijhpdaeXYB8gJL5xxU-EY-j4w84apFav2Kl79ddhi382vJW6l6kBmc11uB-PjrvUExeS8mraRETQmfzFLf7TO-dBO");'>
</div>
<div class="absolute bottom-12 left-12 z-20 max-w-lg">
<div class="flex items-center gap-3 mb-6 text-white">
<div class="size-8 text-primary">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M24 0.757355L47.2426 24L24 47.2426L0.757355 24L24 0.757355ZM21 35.7574V12.2426L9.24264 24L21 35.7574Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<span class="text-xl font-bold tracking-tight">BI &amp; Analytics</span>
</div>
<h1 class="text-white text-5xl font-black leading-tight tracking-tight mb-4">Pilotez votre performance par la donnée.</h1>
<p class="text-[#9dabb9] text-lg">Des solutions d'analyse de données avancées propulsées par Power BI pour une visualisation claire et stratégique.</p>
</div>
</div>
<div class="w-full lg:w-1/2 xl:w-2/5 flex flex-col justify-center items-center p-8 md:p-16 lg:p-24 bg-white dark:bg-background-dark">
<div class="w-full max-w-[420px] flex flex-col gap-8">
<div class="flex flex-col gap-3">
<div class="lg:hidden flex items-center gap-3 mb-4 text-primary">
<div class="size-6">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M24 0.757355L47.2426 24L24 47.2426L0.757355 24L24 0.757355ZM21 35.7574V12.2426L9.24264 24L21 35.7574Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<span class="text-lg font-bold">BI &amp; Analytics</span>
</div>
<h2 class="text-slate-900 dark:text-white text-4xl font-black leading-tight tracking-tight">Bienvenue</h2>
<p class="text-slate-500 dark:text-[#9dabb9] text-base font-normal">Accédez à vos tableaux de bord.</p>
</div>
<form class="flex flex-col gap-5" onsubmit="return false;">
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-white text-sm font-semibold">Email professionnel</label>
<input class="form-input w-full rounded-lg border border-slate-200 dark:border-[#3b4754] bg-slate-50 dark:bg-[#1c2127] text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary h-14 px-4 placeholder:text-slate-400 dark:placeholder:text-[#9dabb9] text-base" placeholder="nom@entreprise.com" type="email"/>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-slate-900 dark:text-white text-sm font-semibold">Mot de passe</label>
</div>
<div class="relative flex items-center">
<input class="form-input w-full rounded-lg border border-slate-200 dark:border-[#3b4754] bg-slate-50 dark:bg-[#1c2127] text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary h-14 pl-4 pr-12 placeholder:text-slate-400 dark:placeholder:text-[#9dabb9] text-base" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-slate-400 dark:text-[#9dabb9] hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
</button>
</div>
</div>
<button class="mt-4 flex w-full cursor-pointer items-center justify-center rounded-lg h-14 bg-primary text-white text-base font-bold leading-normal tracking-wide hover:bg-primary/90 transition-all shadow-lg shadow-primary/20">
                        Se connecter
                    </button>
<div class="flex items-center gap-4 my-2">
<div class="h-px grow bg-slate-200 dark:bg-[#283039]"></div>
<span class="text-xs text-slate-400 dark:text-[#506071] font-bold uppercase tracking-widest">Ou connexion sécurisée</span>
<div class="h-px grow bg-slate-200 dark:bg-[#283039]"></div>
</div>
<button class="flex w-full cursor-pointer items-center justify-center gap-3 rounded-lg h-14 border border-slate-200 dark:border-[#3b4754] bg-transparent text-slate-900 dark:text-white text-sm font-bold hover:bg-slate-50 dark:hover:bg-[#1c2127] transition-all">
<span class="material-symbols-outlined">key</span>
                        Connexion via SSO
                    </button>
</form>
<footer class="mt-8 flex flex-col items-center gap-4">
<div class="flex gap-4">
<a class="text-slate-400 dark:text-[#506071] text-[10px] uppercase font-bold tracking-tighter hover:text-primary" href="#">Support</a>
<span class="text-slate-200 dark:text-[#283039]">•</span>
<a class="text-slate-400 dark:text-[#506071] text-[10px] uppercase font-bold tracking-tighter hover:text-primary" href="#">Confidentialité</a>
<span class="text-slate-200 dark:text-[#283039]">•</span>
<a class="text-slate-400 dark:text-[#506071] text-[10px] uppercase font-bold tracking-tighter hover:text-primary" href="#">Statut Système</a>
</div>
</footer>
</div>
</div>
</div>

</body></html>
