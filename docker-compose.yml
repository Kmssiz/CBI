services:
  db:
    image: postgres:16-alpine
    container_name: PBI_DB
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cbi_user -d cbi_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    container_name: PBI
    build: .
    command: sh -c "python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8222 --workers 4 --timeout 300 --graceful-timeout 60 config.wsgi:application"
    ports:
      - "8222:8222"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  permission-sync:
    container_name: PBI_PERMISSION_SYNC
    build: .
    command: sh -c "while true; do python manage.py sync_pbirs_permissions; sleep 3600; done"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.80.0/24
