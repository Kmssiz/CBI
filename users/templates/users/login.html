{% load static %}
<!doctype html>
<html lang="fr">
<head>
    <script>
        (function () { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); }());
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PBI</title>
    <link rel="icon" type="image/png" href="{% static 'assets/images/W_logo-favicon.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        @font-face { font-family: LegacyRoboto; src: url("{% static 'assets/fonts/roboto/Roboto-Regular.ttf' %}"); font-weight: 400; }
        @font-face { font-family: LegacyRoboto; src: url("{% static 'assets/fonts/roboto/Roboto-Medium.ttf' %}"); font-weight: 500; }
        @font-face { font-family: LegacyRoboto; src: url("{% static 'assets/fonts/roboto/Roboto-Bold.ttf' %}"); font-weight: 700; }

        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body { overflow: hidden; background: #666; font-family: LegacyRoboto, Roboto, Arial, sans-serif; }
        button, input { font: inherit; }
        button { border: 0; cursor: pointer; }
        .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 1em; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; font-feature-settings: 'liga'; }

        .legacy-login-page { width: 100%; min-height: 100vh; display: flex; align-items: stretch; }
        .legacy-login-art {
            width: calc(100% - 560px);
            min-height: 100vh;
            position: relative;
            order: 1;
            background: #d9d9d9 url("{% static 'assets/images/legacy/Login.svg' %}") center center / contain no-repeat;
        }
        .legacy-login-form {
            width: 560px;
            min-height: 100vh;
            order: 2;
            padding: 173px 55px 55px;
            background: #1c1d22;
            color: #f2f2f2;
        }
        .legacy-login-form h1 {
            width: 100%;
            margin: 0 0 58px;
            color: #f2f2f2;
            font-size: 25px;
            line-height: 1.2;
            font-weight: 700;
            text-align: center;
        }
        .legacy-login-form form { width: 100%; margin: 0; }
        .legacy-login-field {
            display: flex;
            align-items: stretch;
            position: relative;
            width: 100%;
            height: 60px;
            margin-bottom: 10px;
            overflow: hidden;
            border: 1px solid #e6e6e6;
            border-radius: 10px;
            background: #f2f2f2;
        }
        .legacy-login-field input {
            display: block;
            width: 100%;
            height: 100%;
            padding: 0 24px;
            border: 0;
            outline: 0;
            background: transparent;
            color: #555;
            font-size: 18px;
        }
        .legacy-login-field input::placeholder { color: #999; opacity: 1; }
        .legacy-login-field:focus-within { border-color: #a5cf4b; box-shadow: 0 0 0 1px #a5cf4b; }
        .legacy-login-help {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            color: #c8c8c8;
            font-size: 14px;
            cursor: pointer;
        }
        .legacy-login-help a { color: #c8c8c8; text-decoration: underline; }
        .legacy-login-help a:hover { color: #a5cf4b; }
        .legacy-login-submit-wrap { display: flex; justify-content: center; width: 100%; }
        .legacy-login-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80%;
            height: 50px;
            padding: 0 20px;
            border-radius: 10px;
            background: #a5cf4b;
            color: #1c1d22;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .legacy-login-submit:hover { background: #a5ce4a; }
        .legacy-login-error {
            margin: -32px 0 24px;
            color: #ef9ca7;
            font-size: 13px;
            text-align: center;
        }
        .legacy-login-logo {
            display: block;
            width: min(250px, 100%);
            height: auto;
            margin: 0 auto 32px;
            filter: invert(1) hue-rotate(180deg);
        }
        .legacy-login-status { margin-top: 16px; color: #92939a; font-size: 11px; text-align: center; text-transform: uppercase; letter-spacing: .12em; }
        .legacy-login-status button { padding: 0; background: transparent; color: inherit; text-decoration: underline; }
        .legacy-login-theme-toggle { position: fixed; top: 20px; right: 22px; z-index: 5; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px; border: 1px solid rgba(255,255,255,.25); border-radius: 18px; background: rgba(28,29,34,.84); color: #f2f2f2; font-size: 11px; font-weight: 700; cursor: pointer; }
        .legacy-login-theme-toggle:hover { border-color: #a5cf4b; color: #a5cf4b; }
        .legacy-login-theme-toggle .material-symbols-outlined { font-size: 17px; }

        html.dark body { background: #111318; }
        html.dark .legacy-login-art { background-color: #24262d; filter: brightness(.7) saturate(.8); }
        html.dark .legacy-login-form { background: #111318; color: #f1f2f4; }
        html.dark .legacy-login-form h1 { color: #f1f2f4; }
        html.dark .legacy-login-field { border-color: #3a3d46; background: #24262d; }
        html.dark .legacy-login-field input { color: #f1f2f4; }
        html.dark .legacy-login-field input::placeholder { color: #a8abb4; }
        html.dark .legacy-login-help,
        html.dark .legacy-login-help a { color: #a8abb4; }
        html.dark .legacy-login-theme-toggle { border-color: #3a3d46; background: #24262d; color: #f1f2f4; }
        html.dark .legacy-status-card { background: #24262d; color: #f1f2f4; }
        html.dark .legacy-status-card p { color: #a8abb4; }

        .legacy-status-modal { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 1rem; background: rgba(0,0,0,.65); }
        .legacy-status-modal.is-open { display: flex; }
        .legacy-status-card { width: min(100%, 360px); padding: 28px; border-radius: 4px; background: #f2f2f2; color: #1c1d22; text-align: center; }
        .legacy-status-card h2 { margin: 0 0 8px; font-size: 18px; }
        .legacy-status-card p { margin: 0 0 20px; color: #666; font-size: 14px; }
        .legacy-status-card button { width: 100%; padding: 11px; border-radius: 3px; background: #a5cf4b; color: #1c1d22; font-weight: 700; }

        @media (max-width: 992px) {
            .legacy-login-art { width: 50%; background-size: cover; }
            .legacy-login-form { width: 50%; padding-left: 30px; padding-right: 30px; }
        }
        @media (max-width: 768px) {
            .legacy-login-art { display: none; }
            .legacy-login-form { width: 100%; padding: 70px 30px 30px; }
        }
        @media (max-width: 576px) {
            .legacy-login-form { padding-left: 15px; padding-right: 15px; }
        }
    </style>
</head>
<body>
    <main class="legacy-login-page">
        <button class="legacy-login-theme-toggle" type="button" id="legacy-login-theme-toggle" aria-pressed="false" title="Activer le mode sombre">
            <span class="material-symbols-outlined" id="legacy-login-theme-icon" aria-hidden="true">dark_mode</span>
            <span id="legacy-login-theme-label">Mode sombre</span>
        </button>
        <section class="legacy-login-art" aria-label="Portail CBI"></section>
        <section class="legacy-login-form" aria-label="Connexion">
            <img class="legacy-login-logo" src="{% static 'assets/images/PortailBI-logo-rem.png' %}" alt="Cellule Business Intelligence">

            <h1>Accéder à votre session.</h1>

            {% if messages %}
                <div class="legacy-login-error">
                    {% for message in messages %}{{ message }}{% if not forloop.last %}<br>{% endif %}{% endfor %}
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}" onsubmit="return submitLegacyLogin(this)">
                {% csrf_token %}
                <div class="legacy-login-field">
                    <input type="text" name="username" id="legacy-username" placeholder="Email/ad2000" autocomplete="username" required>
                </div>
                <div class="legacy-login-field">
                    <input type="password" name="password" id="legacy-password" placeholder="Mot de passe" autocomplete="current-password" required>
                </div>

                <div class="legacy-login-help">
                    <a href="mailto:dsi@groupe-hasnaoui.com">Signaler un problème&nbsp;?</a>
                </div>

                <div class="legacy-login-submit-wrap">
                    <button class="legacy-login-submit" type="submit" id="legacy-login-submit">Connexion</button>
                </div>

            </form>

            <div class="legacy-login-status">
                <button type="button" id="legacy-status-link">Statut système</button>
            </div>
        </section>
    </main>

    <div class="legacy-status-modal" id="legacy-status-modal" role="dialog" aria-modal="true" aria-labelledby="legacy-status-title">
        <div class="legacy-status-card">
            <h2 id="legacy-status-title">Vérification du système</h2>
            <p id="legacy-status-text">Connexion au serveur en cours…</p>
            <button type="button" id="legacy-status-close">Fermer</button>
        </div>
    </div>

    <script>
        (function () {
            var toggle = document.getElementById('legacy-login-theme-toggle');
            var icon = document.getElementById('legacy-login-theme-icon');
            var label = document.getElementById('legacy-login-theme-label');
            var root = document.documentElement;
            function applyTheme(theme) {
                var dark = theme === 'dark';
                root.classList.toggle('dark', dark);
                localStorage.setItem('theme', dark ? 'dark' : 'light');
                toggle.setAttribute('aria-pressed', String(dark));
                toggle.title = dark ? 'Activer le mode clair' : 'Activer le mode sombre';
                icon.textContent = dark ? 'light_mode' : 'dark_mode';
                label.textContent = dark ? 'Mode clair' : 'Mode sombre';
            }
            applyTheme(localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
            toggle.addEventListener('click', function () { applyTheme(root.classList.contains('dark') ? 'light' : 'dark'); });
        }());

        function submitLegacyLogin(form) {
            var button = document.getElementById('legacy-login-submit');
            if (button) { button.disabled = true; button.textContent = 'Connexion…'; }
            return true;
        }

        (function () {
            var open = document.getElementById('legacy-status-link');
            var modal = document.getElementById('legacy-status-modal');
            var close = document.getElementById('legacy-status-close');
            var text = document.getElementById('legacy-status-text');
            if (!open || !modal || !close) return;
            open.addEventListener('click', function () {
                modal.classList.add('is-open');
                text.textContent = 'Connexion au serveur en cours…';
                fetch('{% url "server_status" %}')
                    .then(function (response) { text.textContent = response.ok ? 'Serveur opérationnel.' : 'Serveur indisponible.'; })
                    .catch(function () { text.textContent = 'Serveur indisponible.'; });
            });
            close.addEventListener('click', function () { modal.classList.remove('is-open'); });
            modal.addEventListener('click', function (event) { if (event.target === modal) modal.classList.remove('is-open'); });
        }());
    </script>
</body>
</html>
