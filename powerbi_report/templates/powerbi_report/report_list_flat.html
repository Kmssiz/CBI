{% extends 'base.html' %}
{% load static %}
{% block title %}Reports{% endblock %}
{% block content %}
<div class="pc-container">
  <div class="pc-content">
    <!-- [ Breadcrumb ] start -->
    <div class="page-header">
      <div class="page-block">
        <div class="row align-items-center">
          <div class="col-md-12">
            <div class="page-header-title">
              <h5 class="mb-0">Reports</h5>
            </div>
          </div>
          <div class="col-md-12">
            <ul class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="{% url 'home' %}">Home</a></li>
              <li class="breadcrumb-item active" aria-current="page">Reports</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <!-- [ Breadcrumb ] end -->

    <!-- [ Search Bar & Hierarchical View Button ] start -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="flex-grow-1" style="max-width: 500px;">
        <div class="input-group">
          <input type="text" id="reportSearch" class="form-control" placeholder="Search reports by title...">
        </div>
      </div>
      <div class="d-flex align-items-center">
        <a href="{% url 'powerbi_report:custom_business' %}" class="btn btn-outline-primary ms-3">
          <i class="feather icon-layers"></i> Hierarchical View
        </a>
      </div>
    </div>
    <!-- [ Search Bar & Hierarchical View Button ] end -->

    <!-- [ Reports Cards ] start -->
    <div class="row" id="reportsContainer">
      {% if reports %}
      {% for report in reports %}
      <div class="col-md-4 report-card" data-path="{{ report.Path }}">
        <div class="card mb-4">
          <a href="{% url 'powerbi_report:embed_report' report.Path %}" style="margin: auto;">
            <div class="card-body">
              <h5 class="card-title" style="margin: auto;">{{ report.Name }}</h5>
            </div>
          </a>
        </div>
      </div>
      {% endfor %}
      {% else %}
      <div class="d-flex flex-column align-items-center justify-content-center" style="height: 100%;">
        <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"
          type="module"></script>
        <dotlottie-player src="https://lottie.host/32f49128-c968-4a1a-81ab-f1ea5dc06556/KFFsAaw2Fi.lottie"
          background="transparent" speed="1" style="width: 300px; height: 300px;" loop autoplay>
        </dotlottie-player>
        <p class="text-center">No reports available.</p>
      </div>
      {% endif %}
    </div>
    <!-- [ Reports Cards ] end -->
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const reportSearch = document.getElementById('reportSearch');
    const cards = document.querySelectorAll('.report-card');

    // Filter function - search only
    function filterReports() {
      const searchValue = reportSearch.value.toLowerCase();

      cards.forEach(card => {
        const titleElement = card.querySelector('.card-title');
        const titleText = titleElement ? titleElement.textContent.toLowerCase() : '';
        const matchesSearch = titleText.includes(searchValue);
        card.style.display = matchesSearch ? '' : 'none';
      });
    }

    // Event listener for search
    reportSearch.addEventListener('input', filterReports);
  });
</script>

{% endblock %}
