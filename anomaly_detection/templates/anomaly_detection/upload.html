
{% extends 'base.html' %}
{% load static %}
{% block title %}Log Anomaly Detection{% endblock %}
{% block content %}

<!-- [ Main Content ] start -->
<div class="pc-container">
  <div class="pc-content">
    <!-- [ breadcrumb ] start -->
    <div class="page-header">
      <div class="page-block">
        <div class="row align-items-center">
          <div class="col-md-12">
            <div class="page-header-title">
              <h5 class="mb-0">Log Anomaly Detection</h5>
            </div>
          </div>
          <div class="col-md-12">
            <ul class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="{% url 'home' %}">Home</a></li>
              <li class="breadcrumb-item"><a href="javascript: void(0)">Log Anomaly Detection</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <!-- [ breadcrumb ] end -->

    <div class="row">
      <!-- [ Upload Form ] start -->
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <h5>Upload Log File</h5>
          </div>
          <div class="card-body">
            <form id="upload-form" enctype="multipart/form-data" action="{% url 'anomaly_detection:upload_log' %}" method="POST">
              {% csrf_token %}
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="log_file">Select Log File (.log):</label>
                    <input type="file" id="log_file" name="log_file" class="form-control" accept=".log" required>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group">
                    <label for="dataset_name">Select Model:</label>
                    <select id="dataset_name" name="dataset_name" class="form-control" required>
                      <option value="RSPowerBI">RSPowerBI</option>
                      <option value="RSPortal">RSPortal</option>
                      <option value="RSHostingService">RSHostingService</option>
                    </select>
                  </div>
                </div>
                <div class="col-md-2">
                  <div class="form-group">
                    <label> </label>
                    <button type="submit" id="analyze-btn" class="btn btn-primary w-100">Analyze Logs</button>
                  </div>
                </div>
              </div>
            </form>
            <div id="loading" style="display: none; margin-top: 20px; font-style: italic; color: #666;">
              Processing logs, please wait...
            </div>
          </div>
        </div>
      </div>
      <!-- [ Upload Form ] end -->
    </div>
  </div>
</div>
<!-- [ Main Content ] end -->

<script>
  document.getElementById('upload-form').addEventListener('submit', (e) => {
    const analyzeBtn = document.getElementById('analyze-btn');
    const loadingDiv = document.getElementById('loading');
    
    // Show loading indicator
    analyzeBtn.disabled = true;
    loadingDiv.style.display = 'block';
  });
</script>
{% endblock %}
